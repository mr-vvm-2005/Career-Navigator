name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Build Application
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyBf3MAIVmZYjzlOpP7MJMP23X9gdkhJodM
          VITE_FIREBASE_AUTH_DOMAIN: career-navigator-24ca8.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: career-navigator-24ca8
          VITE_FIREBASE_STORAGE_BUCKET: career-navigator-24ca8.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "976344245664"
          VITE_FIREBASE_APP_ID: 1:976344245664:web:650438109607e5af08f0c5
          VITE_FIREBASE_MEASUREMENT_ID: G-4ZPLYQFEZB
        
      - name: Handle Catch-all Routing
        run: cp dist/index.html dist/404.html
        
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
